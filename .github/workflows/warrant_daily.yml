name: Warrant Flow Radar Daily

on:
  schedule:
    # 17:55 Taiwan time = 09:55 UTC
    - cron: "55 9 * * 1-5"
  workflow_dispatch:

jobs:
  run-warrant-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run warrant flow radar
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          WARRANT_GOOGLE_SHEET_ID: ${{ secrets.WARRANT_GOOGLE_SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python warrant_flow_radar_v01.py | tee warrant_flow_report.txt

      - name: Upload backup report artifact
        uses: actions/upload-artifact@v4
        with:
          name: warrant-flow-radar-report
          path: |
            warrant_flow_report.txt
            warrant_flow_raw.csv
            warrant_volume_top10.csv
            warrant_amount_top10.csv
