name: Market Warrant Flow Radar Daily

on:
  schedule:
    # 18:00 Taiwan time = 10:00 UTC
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

jobs:
  run-market-warrant-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market flow radar
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          WARRANT_GOOGLE_SHEET_ID: ${{ secrets.WARRANT_GOOGLE_SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python market_flow_radar_v11.py | tee market_flow_report.txt

      - name: Upload backup report artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-flow-radar-report
          path: |
            market_flow_report.txt
            market_flow_raw_v11.csv
            market_volume_top10_v11.csv
            market_amount_top10_v11.csv
