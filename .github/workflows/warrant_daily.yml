name: Market Warrant Flow Radar Daily

on:
  schedule:
    # 台灣時間 週一～週五 08:07
    # GitHub Actions cron 使用 UTC
    # Taiwan UTC+8，所以 08:07 台灣時間 = 00:07 UTC
    # 統一等法人 / 籌碼 / 權證資料更新後再推播
    - cron: "7 0 * * 1-5"

  workflow_dispatch:

jobs:
  run-market-warrant-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium

      - name: Run market flow radar
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          WARRANT_GOOGLE_SHEET_ID: ${{ secrets.WARRANT_GOOGLE_SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python market_warrant_flow_radar_v17_dynamic_sources.py | tee market_flow_report.txt

      - name: Upload backup report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-flow-radar-report
          path: |
            market_flow_report.txt
            market_flow_raw_v13.csv
            market_volume_top10_v13.csv
            market_amount_top10_v13.csv
            foreign_buy_top15_v13.csv
            foreign_sell_top15_v13.csv
          if-no-files-found: ignore
