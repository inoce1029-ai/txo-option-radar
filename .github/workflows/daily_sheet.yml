name: TXO Option Radar Google Sheet Daily

on:
  schedule:
    # 台灣時間 週一～週五 18:07
    # GitHub Actions cron 使用 UTC
    # Taiwan UTC+8，所以 18:07 台灣時間 = 10:07 UTC
    # 避開整點 18:00，降低 GitHub Actions 排程延遲或漏跑機率
    - cron: "7 10 * * 1-5"

  workflow_dispatch:

jobs:
  run-radar-sheet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TXO radar, write Google Sheet, and send Telegram
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python txo_option_radar_sheet_v22.py | tee txo_option_radar_report.txt

      - name: Upload backup report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: txo-option-radar-report
          path: |
            txo_option_radar_report.txt
            txo_option_radar_summary_v22.csv
          if-no-files-found: ignore
