name: Market Warrant Intraday Radar 15m

on:
  schedule:
    # Taiwan 09:00-14:00 = UTC 01:00-06:00, every 15 minutes
    - cron: "*/15 1-6 * * 1-5"
  workflow_dispatch:

jobs:
  run-market-warrant-intraday:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run market + warrant intraday radar
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          WARRANT_GOOGLE_SHEET_ID: ${{ secrets.WARRANT_GOOGLE_SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python market_warrant_flow_radar_v07.py | tee market_warrant_intraday_report.txt
      - name: Upload backup report artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-warrant-intraday-radar-report
          path: |
            market_warrant_intraday_report.txt
            market_warrant_flow_raw_v07.csv
            market_volume_top10_v07.csv
            market_amount_top10_v07.csv
