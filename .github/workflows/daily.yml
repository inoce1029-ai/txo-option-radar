name: TXO Option Radar Daily

on:
  schedule:
    # 17:40 Taiwan time = 09:40 UTC
    - cron: "40 9 * * 1-5"
  workflow_dispatch:

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run TXO radar
        run: |
          python txo_option_radar_v11.py | tee txo_option_radar_report.txt

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: txo-option-radar-report
          path: |
            txo_option_radar_report.txt
            txo_option_radar_summary_v11.csv
